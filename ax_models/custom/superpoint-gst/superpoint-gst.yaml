axelera-model-format: 1.0.0

name: superpoint-gst

description: >
  SuperPoint: Self-Supervised Interest Point Detection and Description
  (DeTone et al., 2018).

  The VGG-style CNN backbone + detector head + descriptor head run on the
  Axelera Metis M2 AIPU, including softmax, pixel-shuffle, max-pool NMS,
  border masking, TopK keypoint extraction, bilinear descriptor sampling,
  and L2-normalisation.  The host CPU only applies a score threshold to
  discard zero-padded slots from the fixed-K ONNX outputs.

  Compile-time parameters (baked into the ONNX graph at export):
    max_keypoints (default 1024), remove_borders (default 4), nms_radius (default 4)
  Runtime parameters (set here in YAML):
    detection_threshold

  Prerequisites:
    1. Export the ONNX encoder once (from the voyager-sdk root):
         python ax_models/superpoint/export_onnx.py
    2. Compile for Metis M2:
         python deploy.py ax_models/superpoint/superpoint.yaml
    3. Run inference (torch mode — no GStreamer plugin needed):
         python inference.py ax_models/superpoint/superpoint.yaml --torch

  Output (stored as TensorMeta in axmeta):
    tensors[0]  keypoints    (N, 2)   float32 — (x, y) pixel coords
    tensors[1]  scores       (N,)     float32 — detector confidence
    tensors[2]  descriptors  (N, 256) float32 — L2-normalised descriptors

pipeline:
  - superpoint:
      model_name: superpoint-gst
      input:
        type: image
        color_format: RGB
      preprocess:
        # Resize to the fixed shape the AIPU model was compiled for.
        # Both dimensions must be divisible by 8 (SuperPoint stride = 8).
        - resize:
            width: 640
            height: 480
        # Convert HxWxC uint8 → 1x3xHxW float32 in [0, 1]
        - torch-totensor:
      inference:
        # handle_all: false  →  the SDK skips the paddingdequantize element entirely.
        # The C++ decoder receives raw INT8 NHWC tensors from the AIPU and handles
        # all post-processing (NMS, TopK, descriptor sampling) in fixed-point.
        # exec_torch (Python) is unaffected — ORT runs the full ONNX graph in float32.
        handle_all: false
      postprocess:
        - superpoint-decoder:
            detection_threshold: 0.005
            remove_borders: 4
            max_keypoints: 512

operators:
  superpoint-decoder:
    class: SuperPointDecoder
    class_path: $AXELERA_FRAMEWORK/ax_models/custom/superpoint-gst/superpoint_decoder.py

models:
  superpoint-gst:
    class: AxONNXModel
    class_path: $AXELERA_FRAMEWORK/ax_models/base_onnx.py
    # Generated by ax_models/superpoint/export_onnx.py
    weight_path: $AXELERA_FRAMEWORK/ax_models/custom/superpoint-gst/weights/superpoint_encoder.onnx
    task_category: KeypointDetection
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 480, 640]
    input_color_format: RGB
    dataset: SuperPointCalibDataset
    extra_kwargs:
      aipu_cores: 1
      max_compiler_cores: 1

datasets:
  SuperPointCalibDataset:
    class: DataAdapter
    # Representative images used for INT8 quantization calibration.
    # Any collection of real-world grayscale (or auto-converted RGB) images works.
    # Point this at your own scene images for best accuracy on your use case.
    repr_imgs_dir_path: $AXELERA_FRAMEWORK/data/coco2017_repr400/
    repr_imgs_dataloader_color_format: GRAY
