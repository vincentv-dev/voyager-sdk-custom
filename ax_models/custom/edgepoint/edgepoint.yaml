axelera-model-format: 1.0.0

name: edgepoint

description: >
  EdgePoint2 E64: Lightweight Interest Point Detection and Description.
  (Bökman et al.)

  The CNN backbone runs on the Axelera Metis M2 AIPU. The host CPU reconstructs
  the original EdgePoint2 descriptor and detector heads from the exported
  backbone feature maps, then handles:
    - Max-pool NMS
    - Keypoint extraction (threshold + top-k)
    - Bilinear descriptor sampling + L2-normalisation

  This mirrors the working superpoint-gst deployment strategy and avoids the
  compiler failures caused by multi-scale Resize/Concat/Add fusion inside the
  EdgePoint2 heads.

  Prerequisites:
    1. Export the ONNX encoder (from the edgepoint directory):
         python ax_models/custom/edgepoint/export_onnx.py
    2. Compile for Metis M2:
         python deploy.py ax_models/custom/edgepoint/edgepoint.yaml
    3. Run inference:
         python inference.py ax_models/custom/edgepoint/edgepoint.yaml

  Output (stored as TensorMeta in axmeta):
    tensors[0]  keypoints    (N, 2)   float32 — (x, y) pixel coords
    tensors[1]  scores       (N,)     float32 — detector confidence (raw logit)
    tensors[2]  descriptors  (N, 64)  float32 — L2-normalised descriptors

pipeline:
  - edgepoint:
      model_name: edgepoint
      input:
        type: image
        color_format: GRAY
      preprocess:
        # Both dimensions must be divisible by 32 (backbone stride = 32) AND
        # H/32 and W/32 must be powers of 2 for the Metis tiling scheduler.
        # 480×640 produces H/32=15 and W/32=20 which contain factor-of-5 and
        # fail the DWPU tiler ("Output width reached zero").
        # 512×512 gives H/32=W/32=16 (safe).  Try 512×640 first (H/32=16,
        # W/32=20); fall back to 512×512 if the tiler still fails on W.
        - resize:
            width: 512
            height: 512
        - torch-totensor:
      inference:
        # Skip NHWC→NCHW transpose: dequantize to NHWC float32, decoder reads
        # NHWC directly, eliminating the double-transpose overhead.
        handle_preamble: true
        handle_dequantization_and_depadding: true
        handle_transpose: false
        handle_postamble: false   # no postprocess ONNX graph — no-op
      postprocess:
        - edgepoint-decoder:
            detection_threshold: 0.0   # raw logit threshold (pre-NMS score > this)
            remove_borders: 4
            max_keypoints: 1024        # set to -1 for unlimited
            nms_radius: 2              # max-pool NMS radius (kernel = 2r+1 = 5)
            weights_path: $AXELERA_FRAMEWORK/ax_models/custom/edgepoint/weights/E64.pth
            head_weights_path: $AXELERA_FRAMEWORK/ax_models/custom/edgepoint/weights/edgepoint_heads.bin
            edgepoint_repo: /home/Vydar/EdgePoint2

operators:
  edgepoint-decoder:
    class: EdgePointDecoder
    class_path: $AXELERA_FRAMEWORK/ax_models/custom/edgepoint/edgepoint_decoder.py

models:
  edgepoint:
    class: AxONNXModel
    class_path: $AXELERA_FRAMEWORK/ax_models/base_onnx.py
    weight_path: $AXELERA_FRAMEWORK/ax_models/custom/edgepoint/weights/edgepoint_encoder.onnx
    task_category: KeypointDetection
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 1, 512, 512]
    input_color_format: GRAY
    dataset: EdgePointCalibDataset
    extra_kwargs:
      aipu_cores: 1
      max_compiler_cores: 1

datasets:
  EdgePointCalibDataset:
    class: DataAdapter
    repr_imgs_dir_path: $AXELERA_FRAMEWORK/data/coco2017_repr400/
    repr_imgs_dataloader_color_format: GRAY
