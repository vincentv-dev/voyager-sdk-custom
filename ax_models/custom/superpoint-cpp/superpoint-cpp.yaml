axelera-model-format: 1.0.0

name: superpoint-cpp

description: >
  SuperPoint for C++ inference via AxInferenceNet.
  Raw int8 tensors are produced for C++ postprocessing with NEON-optimised
  softmax, pixel-shuffle, and uint16 NMS — targeting 60+ fps on iMX8MP.
  Feed into LightGlue for feature matching across multiple camera streams.

pipeline:
  - superpoint:
      model_name: superpoint-cpp
      input:
        type: image
      inference:
        # handle_all: False → raw int8 NHWC tensors delivered to C++.
        # The C++ postprocessor owns dequant, softmax, pixel-shuffle, and NMS.
        # Set True if you want the SDK to dequantize to float32 first (easier
        # to start with but slightly slower).
        handle_all: False
      preprocess:
        - resize:
            height: ${{input_height}}
            width: ${{input_width}}
        - convert-color:
            format: RGB2GRAY
        - torch-totensor:
      postprocess:
        - get-raw-tensor:

models:
  superpoint-cpp:
    class: SuperPointONNXModel
    # Reuse the same model class — only the postprocess pipeline changes.
    class_path: $AXELERA_FRAMEWORK/ax_models/custom/superpoint/superpoint_model.py
    weight_path: /home/Vydar/SuperPoint-custom/weights/superpoint.onnx
    task_category: KeypointDetection
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 1, 480, 640]
    input_color_format: GRAY
    dataset: CalibDataset
    extra_kwargs:
      max_compiler_cores: 4
      # Use 1 core per camera for a 4-camera drone setup:
      #   aipu_cores: 1   (4× parallel AxInferenceNet instances)
      # Use 4 cores for a single-camera / maximum-throughput setup:
      aipu_cores: 4
      compilation_config:
        tiling_depth: 6

datasets:
  CalibDataset:
    class: DataAdapter
    repr_imgs_dir_path: $AXELERA_FRAMEWORK/data/coco2017_repr400
    repr_imgs_dataloader_color_format: RGB

# ─── Deployment ──────────────────────────────────────────────────────────────
# inference.py auto-discovers this YAML by scanning ax_models/ for the name field.
# Run once to compile the model and generate the .axnet:
#
#   cd /home/Vydar/voyager-sdk-custom
#   source venv/bin/activate
#   ./inference.py superpoint-cpp fakevideo --frames 1 --no-display
#
# This produces:
#   build/superpoint-cpp/superpoint-cpp.axnet    ← pass to C++ binary
#   build/superpoint-cpp/superpoint-cpp/1/model.json
#
# Then build and run the C++ inference app:
#   make examples
#   examples/bin/superpoint_inference build/superpoint-cpp/superpoint-cpp.axnet media/traffic1_480p.mp4
